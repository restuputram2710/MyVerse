<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="description" content="MyVerse admin console.">
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#6B4EFF">
  <title>Admin — MyVerse</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    (function () { try {
      var g = function (k) { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; };
      var t = g('mv_theme') || g('mv_theme_default') || 'sistem';
      var dark = t === 'gelap' || (t === 'sistem' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {} })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://drive.google.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1.0.1">
  <link rel="stylesheet" href="css/admin.css?v=1.0.1">
</head>
<body class="admin">
  <div id="app" aria-live="polite">
    <div style="min-height:100vh;display:grid;place-items:center"><div class="sk" style="width:380px;height:420px;border-radius:16px"></div></div>
  </div>
  <noscript><p style="padding:24px">Dashboard admin memerlukan JavaScript.</p></noscript>

  <script src="js/config.js?v=1.0.1"></script>
  <script src="js/icons.js?v=1.0.1"></script>
  <script src="js/core.js?v=1.0.1"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <script src="js/admin.js?v=1.0.1"></script>
</body>
</html>
