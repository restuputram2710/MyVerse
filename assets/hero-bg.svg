    <rect x="1120" y="668" width="100" height="5" rx="2.5" fill="#BFD8FF" opacity=".28"/>
    <rect x="1150" y="700" width="44" height="4" rx="2" fill="#BFD8FF" opacity=".22"/>
    <rect x="1100" y="738" width="140" height="4" rx="2" fill="#BFD8FF" opacity=".14"/>
    <rect x="1160" y="780" width="30" height="3" rx="1.5" fill="#BFD8FF" opacity=".12"/>
