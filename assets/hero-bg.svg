<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040915"/>
      <stop offset=".38" stop-color="#0A1B37"/>
      <stop offset=".58" stop-color="#173763"/>
      <stop offset=".68" stop-color="#2C5A8F"/>
    </linearGradient>
    <radialGradient id="moon" cx="1170" cy="230" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CFE3FF" stop-opacity=".55"/>
      <stop offset=".12" stop-color="#9CC2FF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2C5A8F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B4E7E"/><stop offset="1" stop-color="#16305A"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173159"/><stop offset="1" stop-color="#0E2141"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A3A66"/><stop offset=".35" stop-color="#0D2140"/><stop offset="1" stop-color="#050C19"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFD8FF" stop-opacity=".55"/><stop offset="1" stop-color="#BFD8FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      .tw { animation: tw 4s ease-in-out infinite; }
      .tw:nth-child(3n) { animation-delay: -1.3s; animation-duration: 5.5s; }
      .tw:nth-child(4n) { animation-delay: -2.6s; animation-duration: 3.2s; }
      @keyframes tw { 0%, 100% { opacity: .9; } 50% { opacity: .25; } }
      @media (prefers-reduced-motion: reduce) { .tw { animation: none; } }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#moon)"/>
  <circle cx="1170" cy="230" r="34" fill="#E8F1FF" opacity=".9"/>
  <g fill="#DCE9FF">
    <circle class="tw" cx="90" cy="70" r="1.6"/><circle class="tw" cx="210" cy="140" r="1.1"/><circle class="tw" cx="330" cy="60" r="1.4"/>
    <circle class="tw" cx="460" cy="190" r="1"/><circle class="tw" cx="560" cy="90" r="1.7"/><circle class="tw" cx="690" cy="40" r="1.2"/>
    <circle class="tw" cx="760" cy="170" r="1"/><circle class="tw" cx="880" cy="110" r="1.5"/><circle class="tw" cx="980" cy="60" r="1.1"/>
    <circle class="tw" cx="1050" cy="150" r="1.3"/><circle class="tw" cx="1290" cy="90" r="1.6"/><circle class="tw" cx="1380" cy="170" r="1"/>
    <circle class="tw" cx="1480" cy="60" r="1.4"/><circle class="tw" cx="1550" cy="200" r="1.1"/><circle class="tw" cx="150" cy="250" r="1"/>
    <circle class="tw" cx="390" cy="280" r="1.2"/><circle class="tw" cx="620" cy="250" r="1"/><circle class="tw" cx="1420" cy="290" r="1.2"/>
    <circle cx="40" cy="190" r=".8" opacity=".6"/><circle cx="270" cy="30" r=".8" opacity=".7"/><circle cx="520" cy="30" r=".9" opacity=".6"/>
    <circle cx="820" cy="260" r=".8" opacity=".5"/><circle cx="930" cy="230" r=".9" opacity=".6"/><circle cx="1240" cy="30" r=".8" opacity=".7"/>
    <circle cx="1340" cy="250" r=".9" opacity=".5"/><circle cx="1590" cy="110" r=".8" opacity=".6"/><circle cx="720" cy="300" r=".8" opacity=".4"/>
  </g>
