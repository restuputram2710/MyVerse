<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="description" content="Personal portfolio — profile, experience, skills, achievements, and projects.">
  <meta name="theme-color" content="#6B4EFF">
  <title>Blog — MyVerse</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    (function () { try {
      var g = function (k) { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; };
      var t = g('mv_theme') || g('mv_theme_default') || 'sistem';
      var dark = t === 'gelap' || (t === 'sistem' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {} })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://drive.google.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1.0.0">
</head>
<body data-page="blog">
  <div id="chrome-top"></div>
  <main id="main">
    <section class="page-band">
      <div class="container">
        <span class="eyebrow">Blog</span>
        <h1>Notes &amp; Articles</h1>
        <p>Thoughts on web development, learning design, and the craft of building useful things.</p>
      </div>
    </section>
    <section class="section" style="padding-top:40px" aria-label="Articles">
      <div class="container">
        <div class="toolbar">
          <div class="pill-row scroll-x" id="tags" role="group" aria-label="Filter by tag"></div>
          <div class="search-box"><label for="q" class="sr-only">Search articles</label>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="q" class="input" type="search" placeholder="Search articles…" autocomplete="off"></div>
        </div>
        <div class="grid-3" id="posts" aria-live="polite"><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div></div>
        <div class="empty" id="posts-empty" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
          <p><strong>No articles found.</strong></p><p style="font-size:14px">Try another keyword or tag.</p>
        </div>
        <nav class="pagination" id="pager" aria-label="Pagination"></nav>
      </div>
    </section>
  </main>
  <div id="chrome-foot"></div>

  <script src="js/config.js?v=1.0.0"></script>
  <script src="js/icons.js?v=1.0.0"></script>
  <script src="js/core.js?v=1.0.0"></script>
  <script src="js/site.js?v=1.0.0"></script>
  <script src="js/pages.js?v=1.0.0"></script>
</body>
</html>
